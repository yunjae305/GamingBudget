name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 스텝의 if 에서는 secrets 를 직접 못 읽는다 — 잡 env 로 한 번 옮긴다
      HAS_KEY: ${{ secrets.LEDGER_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 화면 테스트 (jsdom)
        run: npm ci --ignore-scripts && npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 개인용: 원격 업데이트가 켜진 디버그 APK.
      #   LEDGER_DEBUG_KEYSTORE_B64 = base64 로 인코딩한 debug.keystore (PC 의 ~/.android/debug.keystore).
      #   있으면 그 키로 서명해서 PC·클라우드에서 만든 APK 와 서로 덮어쓰기가 된다. 없으면 실행마다 새 키.
      #   Gemini 키는 여기 넣지 않는다 (보안 점검 2026-09-29): 공개 저장소의 Actions 아티팩트는 누구나 받을 수 있어서
      #   키가 든 APK 를 올리면 키가 공개되는 것과 같다. AI 기능이 든 APK 는 PC(.env) 나 클라우드 세션(환경 변수)에서
      #   직접 빌드한다. 이 아티팩트는 빌드 확인용이고 AI 조언·영수증 스캔이 안 된다.
      - name: Build debug APK
        env:
          LEDGER_DEBUG_KEYSTORE_B64: ${{ secrets.LEDGER_DEBUG_KEYSTORE_B64 }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      # 스토어용: 서명 키가 시크릿에 있을 때만. 원격 업데이트 없음.
      #   LEDGER_KEYSTORE_B64  = base64 로 인코딩한 .jks
      #   LEDGER_STORE_PASSWORD / LEDGER_KEY_ALIAS / LEDGER_KEY_PASSWORD
      - name: Decode keystore
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.LEDGER_KEYSTORE_B64 }}" | base64 -d > release.jks

      - name: Build release APK + AAB
        if: env.HAS_KEY == 'true'
        env:
          LEDGER_STORE_FILE: release.jks
          LEDGER_STORE_PASSWORD: ${{ secrets.LEDGER_STORE_PASSWORD }}
          LEDGER_KEY_ALIAS: ${{ secrets.LEDGER_KEY_ALIAS }}
          LEDGER_KEY_PASSWORD: ${{ secrets.LEDGER_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: ledger-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
